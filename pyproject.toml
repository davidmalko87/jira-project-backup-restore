[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-project-backup-restore"
version = "1.3.1"
description = "Backup and restore individual Jira Cloud projects via REST API"
readme = "README.md"
license = "MIT"
authors = [{ name = "David Malko", email = "davidmalko87@gmail.com" }]
requires-python = ">=3.10"
keywords = ["jira", "backup", "restore", "atlassian", "jira-cloud", "atlassian-cloud"]
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/davidmalko87/jira-project-backup-restore"
Repository = "https://github.com/davidmalko87/jira-project-backup-restore"
Changelog = "https://github.com/davidmalko87/jira-project-backup-restore/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/davidmalko87/jira-project-backup-restore/issues"

[project.scripts]
jira-backup = "jira_tool.cli:main"
